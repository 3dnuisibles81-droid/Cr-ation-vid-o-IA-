<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Video - Studio IA</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1e1e1e;
    --text: #ffffff;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --border: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 { font-size: 2rem; margin-bottom: 10px; }
  h1 span { color: var(--accent); }
  p.subtitle { color: #aaa; font-size: 1rem; }
  .app-container {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h2 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  textarea {
    width: 100%;
    height: 150px;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: white;
    font-size: 1rem;
    resize: none;
    margin-bottom: 15px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .settings-row { display: flex; gap: 10px; margin-bottom: 15px; }
  select, input {
    background: #0a0a0a;
    border: 1px solid var(--border);
    color: white;
    padding: 10px;
    border-radius: 8px;
    flex: 1;
    font-size: 0.9rem;
  }
  .api-key-box {
    background: #2a1a1a;
    border: 1px solid #ff4444;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
  }
  .api-key-box label { font-size: 0.85rem; color: #ff8888; margin-bottom: 5px; display: block; }
  .api-key-box input { border-color: #ff4444; width: 100%; }
  button {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #444; cursor: not-allowed; }
  .video-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    overflow: hidden;
    position: relative;
    margin-bottom: 15px;
  }
  .result-image { width: 100%; height: 100%; object-fit: cover; display: none; }
  .placeholder-text { position: absolute; z-index: 1; text-align: center; color: #888; }
  .loading-spinner { display: none; flex-direction: column; align-items: center; gap: 15px; z-index: 2; }
  .spinner {
    width: 40px; height: 40px; border: 4px solid #333; border-top: 4px solid var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .status-log { font-size: 0.85rem; color: #aaa; margin-top: 10px; font-family: monospace; }
</style>
</head>
<body>

<header>
  <h1>Text to Video <span>Studio</span></h1>
  <p class="subtitle">Transformez vos scripts en animations cinématographiques</p>
</header>

<div class="app-container">
  <div class="panel">
    <h2>✍️ Votre Script</h2>
    <div class="api-key-box">
      <label>⚠️ Clé API (Requis pour générer)</label>
      <input type="password" id="apiKey" placeholder="Collez votre clé API ici (ex: sk-...)" value="demo-key-123">
    </div>
    <textarea id="promptText" placeholder="Décrivez votre scène ici...">Maurice avec un nœud rouge discute avec Carapuce qui porte une couronne dans une forêt d'automne.</textarea>
    <div class="settings-row">
      <select id="videoStyle">
        <option value="Cinéma 3D">Style : Cinéma 3D</option>
        <option value="Dessin animé">Style : Dessin animé</option>
        <option value="Réaliste">Style : Réaliste</option>
      </select>
      <select id="aspectRatio">
        <option value="16:9">Format : 16:9 (Paysage)</option>
        <option value="9:16">Format : 9:16 (Vertical)</option>
      </select>
    </div>
    <button id="generateBtn" onclick="generateVideo()">🚀 Générer la vidéo</button>
    <div class="status-log" id="statusLog">Prêt à générer.</div>
  </div>

  <div class="panel">
    <h2>🎬 Résultat</h2>
    <div class="video-container" id="videoContainer">
      <div class="placeholder-text" id="placeholderText">L'image apparaîtra ici</div>
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <div>Génération en cours...</div>
      </div>
      <img id="resultImage" class="result-image" src="" alt="Résultat de la génération">
    </div>
    <button id="downloadBtn" style="display: none; background: #10b981;" onclick="downloadImage()">⬇️ Télécharger l'image</button>
  </div>
</div>

<script>
  async function generateVideo() {
    const prompt = document.getElementById('promptText').value.trim();
    if (!prompt) { alert("Veuillez décrire votre scène."); return; }

    const btn = document.getElementById('generateBtn');
    const spinner = document.getElementById('loadingSpinner');
    const placeholder = document.getElementById('placeholderText');
    const img = document.getElementById('resultImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusLog = document.getElementById('statusLog');

    btn.disabled = true;
    btn.textContent = "Génération...";
    placeholder.style.display = 'none';
    img.style.display = 'none';
    downloadBtn.style.display = 'none';
    spinner.style.display = 'flex';
    statusLog.textContent = `Création de l'image pour : "${prompt.substring(0, 30)}..."`;

    try {
      await new Promise(resolve => setTimeout(resolve, 2000)); 
      
      const svgImage = `
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
          <rect width="100%" height="100%" fill="#2d1b13"/>
          <circle cx="400" cy="225" r="200" fill="#3b251b"/>
          <text x="50%" y="40%" fill="#fff" font-family="sans-serif" font-size="30" text-anchor="middle" font-weight="bold">✨ Résultat de l'IA ✨</text>
          <text x="50%" y="50%" fill="#ccc" font-family="sans-serif" font-size="20" text-anchor="middle">${prompt}</text>
          <text x="50%" y="60%" fill="#888" font-family="sans-serif" font-size="16" text-anchor="middle">(Image de démonstration)</text>
          <ellipse cx="400" cy="350" rx="60" ry="40" fill="#8b6b3c"/>
          <path d="M 400 310 Q 440 310 460 350 Q 440 390 400 390 Q 360 390 340 350 Q 360 310 400 310 Z" fill="#4a7c3f"/>
          <circle cx="460" cy="340" r="15" fill="#e6d3a8"/>
          <circle cx="465" cy="335" r="3" fill="#000"/>
          <path d="M 450 350 L 440 345 L 450 355 Z" fill="#d32f2f"/>
        </svg>
      `;
      const imageUrl = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgImage)));

      img.src = imageUrl;
      img.style.display = 'block';
      spinner.style.display = 'none';
      downloadBtn.style.display = 'block';
      statusLog.textContent = "✅ Image générée avec succès !";

    } catch (error) {
      console.error(error);
      spinner.style.display = 'none';
      placeholder.style.display = 'block';
      statusLog.textContent = "❌ Erreur : " + error.message;
    } finally {
      btn.disabled = false;
      btn.textContent = "🚀 Générer la vidéo";
    }
  }

  function downloadImage() {
    const imgUrl = document.getElementById('resultImage').src;
    const a = document.createElement('a');
    a.href = imgUrl;
    a.download = 'mon-image-ia.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
