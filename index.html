<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Video - Studio IA</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1e1e1e;
    --text: #ffffff;
    --accent: #3b82f6; /* Bleu électrique */
    --accent-hover: #2563eb;
    --border: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 30px;
  }
  h1 { font-size: 2rem; margin-bottom: 10px; }
  h1 span { color: var(--accent); }
  p.subtitle { color: #aaa; font-size: 1rem; }

  .app-container {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 768px) {
    .app-container { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h2 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }

  textarea {
    width: 100%;
    height: 150px;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: white;
    font-size: 1rem;
    resize: none;
    margin-bottom: 15px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .settings-row {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }
  select, input {
    background: #0a0a0a;
    border: 1px solid var(--border);
    color: white;
    padding: 10px;
    border-radius: 8px;
    flex: 1;
    font-size: 0.9rem;
  }
  select:focus, input:focus { outline: none; border-color: var(--accent); }

  /* Clé API */
  .api-key-box {
    background: #2a1a1a;
    border: 1px solid #ff4444;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 20px;
  }
  .api-key-box label { font-size: 0.85rem; color: #ff8888; margin-bottom: 5px; display: block; }
  .api-key-box input { border-color: #ff4444; width: 100%; }

  button {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #444; cursor: not-allowed; }

  /* Zone vidéo */
  .video-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    overflow: hidden;
    position: relative;
    margin-bottom: 15px;
  }
  .video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .loading-spinner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #333;
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .status-log {
    font-size: 0.85rem;
    color: #aaa;
    margin-top: 10px;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <h1>Text to Video <span>Studio</span></h1>
  <p class="subtitle">Transformez vos scripts en animations cinématographiques</p>
</header>

<div class="app-container">
  
  <!-- PANNEAU GAUCHE : CONTRÔLES -->
  <div class="panel">
    <h2>✍️ Votre Script</h2>

    <div class="api-key-box">
      <label>⚠️ Clé API (Requis pour générer)</label>
      <input type="password" id="apiKey" placeholder="Collez votre clé API ici (ex: sk-...)">
    </div>

    <textarea id="promptText" placeholder="Décrivez votre scène ici...&#10;Ex: Maurice la tortue avec un nœud rouge discute avec Carapuce qui porte une couronne, dans une forêt d'automne."></textarea>

    <div class="settings-row">
      <select id="videoStyle">
        <option value="Cinéma 3D">Style : Cinéma 3D</option>
        <option value="Dessin animé">Style : Dessin animé</option>
        <option value="Réaliste">Style : Réaliste</option>
        <option value="Aquarelle">Style : Aquarelle</option>
      </select>
      
      <select id="aspectRatio">
        <option value="16:9">Format : 16:9 (Paysage)</option>
        <option value="9:16">Format : 9:16 (Vertical/TikTok)</option>
      </select>
    </div>

    <button id="generateBtn" onclick="generateVideo()">🚀 Générer la vidéo</button>
    <div class="status-log" id="statusLog">Prêt à générer.</div>
  </div>

  <!-- PANNEAU DROIT : RÉSULTAT -->
  <div class="panel">
    <h2>🎬 Résultat</h2>
    
    <div class="video-container" id="videoContainer">
      <div class="placeholder" id="videoPlaceholder">La vidéo apparaîtra ici</div>
      
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <div>Génération en cours...</div>
        <div style="font-size: 0.8rem; color: #888;">Cela peut prendre quelques minutes.</div>
      </div>

      <video id="resultVideo" controls autoplay loop></video>
    </div>

    <button id="downloadBtn" style="display: none; background: #10b981;" onclick="downloadVideo()">⬇️ Télécharger la vidéo</button>
  </div>

</div>

<script>
  // ⚠️ ATTENTION : Ceci est une simulation d'interface. 
  // Pour que cela fonctionne réellement, il faut connecter une vraie API de génération de vidéo (comme RunwayML, Luma Dream Machine, ou Stability AI).
  // Les APIs vidéo coûtent cher et nécessitent un serveur backend pour cacher votre clé API.

  async function generateVideo() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const prompt = document.getElementById('promptText').value.trim();
    const style = document.getElementById('videoStyle').value;
    const ratio = document.getElementById('aspectRatio').value;

    if (!apiKey) {
      alert("Veuillez entrer une clé API.");
      return;
    }
    if (!prompt) {
      alert("Veuillez décrire votre scène.");
      return;
    }

    // Mise à jour de l'interface
    const btn = document.getElementById('generateBtn');
    const spinner = document.getElementById('loadingSpinner');
    const placeholder = document.getElementById('videoPlaceholder');
    const video = document.getElementById('resultVideo');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusLog = document.getElementById('statusLog');

    btn.disabled = true;
    btn.textContent = "Génération...";
    placeholder.style.display = 'none';
    video.style.display = 'none';
    downloadBtn.style.display = 'none';
    spinner.style.display = 'flex';
    
    statusLog.textContent = `Envoi de la requête pour : "${prompt.substring(0, 30)}..."`;

    try {
      // -----------------------------------------------------------------
      // C'EST ICI QUE VOUS DEVEZ METTRE L'APPEL À VOTRE API DE VIDÉO
      // -----------------------------------------------------------------
      
      // EXEMPLE SIMULÉ (Puisque nous n'avons pas de vraie API branchée)
      // On fait semblant d'attendre 5 secondes
      await new Promise(resolve => setTimeout(resolve, 5000)); 
      
      // Pour la démo, on utilise une vidéo libre de droits (un exemple de tortue)
      const fakeVideoUrl = "https://cdn.pixabay.com/video/2022/07/24/125309-733670823_large.mp4"; 

      // Affichage du résultat
      video.src = fakeVideoUrl;
      video.style.display = 'block';
      spinner.style.display = 'none';
      downloadBtn.style.display = 'block';
      statusLog.textContent = "✅ Vidéo générée avec succès ! (Ceci est une simulation)";

    } catch (error) {
      console.error(error);
      spinner.style.display = 'none';
      placeholder.style.display = 'block';
      statusLog.textContent = "❌ Erreur : " + error.message;
      alert("Une erreur est survenue lors de la génération.");
    } finally {
      btn.disabled = false;
      btn.textContent = "🚀 Générer la vidéo";
    }
  }

  function downloadVideo() {
    const videoUrl = document.getElementById('resultVideo').src;
    const a = document.createElement('a');
    a.href = videoUrl;
    a.download = 'ma-video-ia.mp4';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
