<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text to Image - Studio IA</title>
<style>
  :root {
    --bg: #121212;
    --panel: #1e1e1e;
    --text: #ffffff;
    --accent: #8b5cf6; /* Violet pour le changement */
    --accent-hover: #7c3aed;
    --border: #333;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body {
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 30px; }
  h1 { font-size: 2rem; margin-bottom: 10px; }
  h1 span { color: var(--accent); }
  p.subtitle { color: #aaa; font-size: 1rem; }
  .app-container {
    width: 100%;
    max-width: 900px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 768px) { .app-container { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h2 { font-size: 1.2rem; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
  textarea {
    width: 100%;
    height: 150px;
    background: #0a0a0a;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: white;
    font-size: 1rem;
    resize: none;
    margin-bottom: 15px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  
  button {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { background: #444; cursor: not-allowed; }
  
  .image-container {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 8px;
    border: 1px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    overflow: hidden;
    position: relative;
    margin-bottom: 15px;
  }
  
  .result-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .placeholder-text {
    position: absolute;
    z-index: 1;
    text-align: center;
    color: #888;
  }

  .loading-spinner {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 2;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #333;
    border-top: 4px solid var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  .status-log {
    font-size: 0.85rem;
    color: #aaa;
    margin-top: 10px;
    font-family: monospace;
  }
</style>
</head>
<body>

<header>
  <h1>Studio <span>IA</span> Créatif</h1>
  <p class="subtitle">Transformez vos descriptions en images uniques</p>
</header>

<div class="app-container">
  
  <div class="panel">
    <h2>✍️ Votre Description</h2>

    <textarea id="promptText" placeholder="Décrivez votre scène ici...">Maurice et Carapuce sont deux tortues d'Hermann dans une forêt d'automne. Maurice porte un élégant nœud rouge autour du cou et regarde Carapuce. Carapuce, une tortue plus ronde, porte une jolie couronne dorée sur la tête et sourit. Les feuilles mortes tombent autour d'elles. Style animation 3D de qualité cinéma, éclairage chaleureux, ambiance amicale et mignonne.</textarea>

    <button id="generateBtn" onclick="generateImage()">🎨 Créer l'image</button>
    <div class="status-log" id="statusLog">Prêt à créer.</div>
  </div>

  <div class="panel">
    <h2>🖼️ Résultat</h2>
    
    <div class="image-container" id="imageContainer">
      <div class="placeholder-text" id="placeholderText">L'image apparaîtra ici</div>
      
      <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
        <div>L'IA dessine...</div>
        <div style="font-size: 0.8rem; color: #888;">(Cela prend 5 à 10 secondes)</div>
      </div>

      <img id="resultImage" class="result-image" src="" alt="Résultat de la génération">
    </div>

    <button id="downloadBtn" style="display: none; background: #10b981;" onclick="downloadImage()">⬇️ Télécharger l'image</button>
  </div>

</div>

<script>
  async function generateImage() {
    const prompt = document.getElementById('promptText').value.trim();
    
    if (!prompt) {
      alert("Veuillez décrire votre scène.");
      return;
    }

    const btn = document.getElementById('generateBtn');
    const spinner = document.getElementById('loadingSpinner');
    const placeholder = document.getElementById('placeholderText');
    const img = document.getElementById('resultImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusLog = document.getElementById('statusLog');

    // Mise à jour de l'interface pendant le chargement
    btn.disabled = true;
    btn.textContent = "Création en cours...";
    placeholder.style.display = 'none';
    img.style.display = 'none';
    downloadBtn.style.display = 'none';
    spinner.style.display = 'flex';
    
    statusLog.textContent = "Connexion à l'IA en cours...";

    try {
      // ON UTILISE POLLINATIONS ICI (Une IA gratuite)
      // On ajoute "seed" avec un nombre aléatoire pour que l'image change à chaque clic
      const seed = Math.floor(Math.random() * 1000000);
      const encodedPrompt = encodeURIComponent(prompt);
      
      // URL de l'IA
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=576&nologo=true&seed=${seed}`;

      // On charge l'image
      img.src = imageUrl;
      
      // On attend que l'image soit chargée
      img.onload = () => {
        img.style.display = 'block';
        spinner.style.display = 'none';
        downloadBtn.style.display = 'block';
        statusLog.textContent = "✅ Image générée avec succès !";
        btn.disabled = false;
        btn.textContent = "🎨 Créer l'image";
      };

      // Si l'IA met trop de temps ou plante
      img.onerror = () => {
        spinner.style.display = 'none';
        placeholder.style.display = 'block';
        statusLog.textContent = "❌ L'IA est surchargée. Veuillez réessayer.";
        btn.disabled = false;
        btn.textContent = "🎨 Créer l'image";
      };

    } catch (error) {
      console.error(error);
      spinner.style.display = 'none';
      placeholder.style.display = 'block';
      statusLog.textContent = "❌ Erreur : " + error.message;
      btn.disabled = false;
      btn.textContent = "🎨 Créer l'image";
    }
  }

  function downloadImage() {
    const imgUrl = document.getElementById('resultImage').src;
    const a = document.createElement('a');
    a.href = imgUrl;
    a.target = "_blank"; // Ouvre dans un nouvel onglet pour forcer le téléchargement
    a.download = 'image-maurice-carapuce.jpg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
</script>
</body>
</html>
